[project]
name = "minilc"
version = "0.1.0"
description = "Minimal reproduction of the letta-ai/letta-code architecture (study artifact)."
requires-python = ">=3.10"
dependencies = []  # the reproduction itself is stdlib-only (needs the git binary)

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
minilc-demo = "minilc.demo:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

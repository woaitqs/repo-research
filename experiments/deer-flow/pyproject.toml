[project]
name = "minideer"
version = "0.1.0"
description = "Minimal reproduction of the bytedance/deer-flow SuperAgent harness assembly (study artifact)."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
minideer-demo = "minideer.demo:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

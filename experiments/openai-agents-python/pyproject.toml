[project]
name = "miniagents"
version = "0.1.0"
description = "Minimal reproduction of the openai/openai-agents-python runtime architecture (study artifact)."
requires-python = ">=3.10"
dependencies = []  # the reproduction itself is stdlib-only

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
miniagents-demo = "miniagents.demo:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "minispace"
version = "0.1.0"
description = "Minimal reproduction of the LLM Space desktop workbench loop (study artifact)."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
minispace-demo = "minispace.demo:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

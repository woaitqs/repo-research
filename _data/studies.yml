- id: openhands
  number: "02"
  name: OpenHands
  category:
    en: Agent SDK & runtime
    zh: Agent SDK 与运行时
  pins:
    - label: OpenHands/OpenHands
      rev: 7ea83ba
      url: https://github.com/OpenHands/OpenHands/tree/7ea83bab4fe71149b88b5a8a6b9efe9042cb362d

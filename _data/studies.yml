      appending a `Condensation` event.
    zh: "`OpenHands/OpenHands` 现在是 Agent Canvas 界面；agent 本体在 `software-agent-sdk` 中——事件溯源的会话、无状态的 `step()`、作为事件日志投影的 LLM 上下文，以及通过追加 `Condensation` 事件完成的压缩。"
